<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To the Wedding</title>
<meta name="description" content="A one-minute card game presenting Madhura Redij's illustrated wedding deck for Ketaki and Prasanna.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="game.js" defer></script>
</head>
<body>

<div id="fit"><div id="stage" aria-live="polite">
  <img class="frame" src="border.svg" alt="">

  <!-- INTRO -->
  <section class="screen" id="intro" aria-label="Start">
    <div aria-hidden="true">
      <div class="flank flank-l"></div>
      <div class="flank flank-r"></div>
      <div class="corner intro-corner intro-corner-l"></div>
      <div class="corner intro-corner intro-corner-r"></div>
    </div>
    <div class="intro-head">
      <p class="caps intro-names">KETAKI &amp; PRASANNA</p>
      <h1 class="intro-title">To the Wedding</h1>
      <p class="intro-line">Bring the couple to each of their four ceremonies.</p>
    </div>
    <div class="intro-arch">
      <div class="rim intro-rim"><div class="rim2"><div class="recess intro-recess">
        <div class="intro-stack">
          <img class="back back-1" src="cards/back.png" alt="">
          <img class="back back-2" src="cards/back.png" alt="">
          <img class="back back-3" src="cards/back.png" alt="Card back: Ketaki and Prasanna beneath a floral arch">
        </div>
      </div></div></div>
      <div class="step-top intro-step-top"></div>
      <div class="step-front intro-step-front" data-dias="18"></div>
    </div>
    <div class="intro-actions">
      <button class="btn" id="startBtn" type="button">Deal</button>
      <button class="link" type="button" data-go="deck">View the deck</button>
    </div>
  </section>

  <!-- PLAY -->
  <section class="screen" id="play" aria-label="Play" hidden>
    <header class="bar">
      <p class="title-sm">To the Wedding</p>
      <button class="link" type="button" data-go="deck">View the deck</button>
    </header>
    <section class="niches" id="niches" aria-label="Ceremony niches"></section>
    <div class="floor" aria-hidden="true"></div>
    <section class="spread" aria-label="Your spread"><div class="spread-tilt" id="spread"></div></section>
    <div aria-hidden="true">
      <div class="corner corner-l"></div>
      <div class="corner corner-r"></div>
    </div>
    <div class="under">
      <div class="strip" id="strip" role="status"></div>
      <button class="btn" type="button" id="dealBtn">Deal again</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <p class="sr-only" id="progress" role="status">0 of 4 ceremonies complete</p>
  </section>

  <!-- LOCK -->
  <section class="screen" id="lock" aria-label="Ceremony complete" hidden>
    <header class="bar">
      <p class="title-sm">To the Wedding</p>
      <button class="link" type="button" data-go="restart">Play again</button>
    </header>
    <div class="lock-arch">
      <div class="rim lock-rim" id="lockRim">
        <div class="rim2" id="lockRim2"><div class="recess" id="lockRecess">
          <div class="lock-cards">
            <div class="big big-k"><img id="lockK" alt=""><div class="foil"></div></div>
            <div class="big big-q"><img id="lockQ" alt=""><div class="foil"></div></div>
          </div>
        </div></div>
      </div>
      <div id="garland" aria-hidden="true"></div>
      <div class="lock-plinth">
        <div class="step-top lock-step-top"></div>
        <div class="step-front lock-step-front" data-dias="20"></div>
      </div>
    </div>
    <div class="lock-text">
      <p class="caps lock-caps">CEREMONY COMPLETE</p>
      <h2 class="lock-title" id="lockTitle"></h2>
      <button class="btn lock-continue" type="button" id="continueBtn">Continue</button>
      <button class="link phone-only" type="button" data-go="deck">View the deck</button>
    </div>
  </section>

  <!-- FINALE / DECK VIEW -->
  <section class="screen" id="finale" aria-label="The whole deck" hidden>
    <div class="fin-head">
      <h2 class="fin-title" id="finTitle"></h2>
      <p class="fin-sub" id="finSub"></p>
    </div>
    <div class="couples" id="couples"></div>
    <div class="fans" id="fans"></div>
    <div class="fin-under">
      <div class="strip" id="finStrip" role="status"></div>
      <div class="fin-actions">
        <button class="btn" type="button" data-go="restart">Play again</button>
        <button class="link" type="button" id="finBack">Back</button>
      </div>
    </div>
  </section>

</div></div>
</body>
</html>
